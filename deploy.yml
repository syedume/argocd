apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-deployment
  labels:
    app: netflix
    version: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: netflix
      version: stable
  template:
    metadata:
      labels:
        app: netflix
        version: stable
    spec:
      containers:
        - name: netflix-container
          image: rahamshaik/mynetflix:1.0
          ports:
            - containerPort: 80
